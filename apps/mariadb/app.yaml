id: mariadb
name: MariaDB
version: "11.8"
summary:
  en: Community-developed relational database compatible with MySQL (LTS release).
  zh: 社区开发、兼容 MySQL 的关系型数据库（LTS 版本）。
description:
  en: |-
    MariaDB 11.8 LTS. The root password, and optionally a database with its own user,
    are set up on first start. The process deployment uses MariaDB from the system
    package manager (Homebrew on macOS) and keeps its data in the app directory.
  zh: |-
    MariaDB 11.8 LTS。首次启动时设置 root 密码，并可选创建数据库及其专属用户。进程守护部署
    使用系统包管理器（macOS 上为 Homebrew）提供的 MariaDB，数据保存在应用目录中。
icon: icon.svg
categories: [database, sql]
homepage: https://mariadb.org
license: GPL-2.0

settings:
  - key: PORT
    type: port
    default: 3306
    label: { en: Port, zh: 端口 }
  - key: BIND
    type: select
    default: 127.0.0.1
    label: { en: Listen address, zh: 监听地址 }
    options:
      - { value: 127.0.0.1, label: { en: This machine only, zh: 仅本机 } }
      - { value: 0.0.0.0, label: { en: All interfaces, zh: 所有网络接口 } }
  - key: MARIADB_ROOT_PASSWORD
    type: password
    required: true
    generate: true
    install_only: true
    label: { en: Root password, zh: root 密码 }
  - key: MARIADB_DATABASE
    type: string
    default: ""
    install_only: true
    label: { en: Database, zh: 数据库 }
    description:
      en: Created on first start. Optional.
      zh: 首次启动时创建，可留空。
  - key: MARIADB_USER
    type: string
    default: ""
    install_only: true
    label: { en: User, zh: 用户 }
    description:
      en: A user with all privileges on the database above. Optional.
      zh: 拥有上述数据库全部权限的用户，可留空。
  - key: MARIADB_PASSWORD
    type: password
    generate: true
    install_only: true
    label: { en: User password, zh: 用户密码 }

database:
  engine: mariadb
  host: ${BIND}
  port: ${PORT}
  user: root
  password: ${MARIADB_ROOT_PASSWORD}

docker:
  compose: docker/compose.yaml

process:
  platforms: [linux, macos]
  unix:
    install: process/install.sh
    configure: process/configure.sh
    start: process/start.sh
    uninstall: process/uninstall.sh
    lib: [process/lib.sh, process/mariadb.sh]
  health_check:
    type: tcp
    host: ${BIND}
    port: ${PORT}
