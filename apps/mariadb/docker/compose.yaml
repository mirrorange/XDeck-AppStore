services:
  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?a root password is required}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-}
      MARIADB_USER: ${MARIADB_USER:-}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-}
    ports:
      - ${BIND:-127.0.0.1}:${PORT:-3306}:3306
    volumes:
      - ./data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
