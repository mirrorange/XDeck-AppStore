id: nginx
name: Nginx
version: "1.30-1"
summary:
  en: High-performance web server, reverse proxy and load balancer.
  zh: 高性能 Web 服务器、反向代理与负载均衡器。
description:
  en: |-
    Serves the default page on its port and the websites you create under
    Websites in XDeck: static sites, reverse proxies and redirects with HTTPS
    certificates. nginx.conf and conf.d/*.conf in the app directory are yours
    to edit. The Docker deployment uses host networking, so sites listen on
    the host's ports directly. On Linux and macOS the process deployment uses
    nginx from the system package manager; on Windows it downloads the
    official build from nginx.org.
  zh: |-
    在其端口上提供默认页面，并运行你在 XDeck「网站」中创建的站点：静态站点、反向代理和
    重定向，支持 HTTPS 证书。应用目录中的 nginx.conf 与 conf.d/*.conf 可自行编辑。
    Docker 部署使用主机网络，站点直接监听主机端口。在 Linux 和 macOS 上，进程守护部署
    使用系统包管理器提供的 nginx；在 Windows 上从 nginx.org 下载官方版本。
icon: icon.svg
categories: [web, proxy]
homepage: https://nginx.org
license: BSD-2-Clause

settings:
  - key: PORT
    type: port
    default: 8080
    label: { en: Port of the default page, zh: 默认页面端口 }
  - key: BIND
    type: select
    default: 0.0.0.0
    label: { en: Listen address, zh: 监听地址 }
    options:
      - { value: 0.0.0.0, label: { en: All interfaces, zh: 所有网络接口 } }
      - { value: 127.0.0.1, label: { en: This machine only, zh: 仅本机 } }

# XDeck manages websites on installations of this app.
nginx:
  service: nginx

docker:
  compose: docker/compose.yaml
  files:
    - { source: docker/nginx.conf, target: nginx.conf }
    - {
        source: docker/templates/default-server.conf.template,
        target: templates/default-server.conf.template,
      }
    - { source: shared/index.html, target: html/index.html }

process:
  unix:
    install: process/install.sh
    configure: process/configure.sh
    start: process/start.sh
    control: process/control.sh
    uninstall: process/uninstall.sh
    lib: [process/lib.sh]
  windows:
    install: process/install.ps1
    configure: process/configure.ps1
    start: process/start.ps1
    control: process/control.ps1
    uninstall: process/uninstall.ps1
    lib: [process/lib.ps1]
  files:
    - { source: process/nginx.conf, target: nginx.conf }
    - { source: process/mime.types, target: mime.types }
    - { source: shared/index.html, target: html/index.html }
  health_check:
    type: tcp
    host: ${BIND}
    port: ${PORT}
