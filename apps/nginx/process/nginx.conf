# Main configuration of this Nginx server. It is yours to edit: XDeck keeps
# it on updates and checks it when you save it under Websites → Nginx.
# Relative paths are relative to the app directory.

# Generated from the app's settings: user, workers, error log.
include conf/main.conf;
pid run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # Generated from the app's settings: access log, temporary files and the
    # default page on the app's port.
    include conf/http.conf;
    # Your own configuration.
    include conf.d/*.conf;
    # Websites managed by XDeck.
    include sites/*.conf;
}
