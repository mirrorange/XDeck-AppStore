# Main configuration of this Nginx server. It is yours to edit: XDeck keeps
# it on updates and checks it when you save it under Websites → Nginx.
user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # The default page on the app's port (PORT and BIND settings).
    include /etc/nginx/default-server.conf;
    # Your own configuration: conf.d/ in the app directory.
    include /etc/nginx/conf.d/*.conf;
    # Websites managed by XDeck: sites/ in the app directory.
    include /etc/nginx/sites/*.conf;
}
