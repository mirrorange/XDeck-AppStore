services:
  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    # No network_mode or ports: XDeck adds the host network or publishes the
    # ports nginx listens on, depending on the container engine.
    environment:
      NGINX_PORT: ${PORT:-8080}
      # templates/*.template → /etc/nginx/* when the container starts.
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./templates:/etc/nginx/templates:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./sites:/etc/nginx/sites:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./acme:/etc/nginx/acme:ro
      - ./html:/usr/share/nginx/html:ro
      - ./www:/var/www:ro
      - ./logs:/var/log/nginx
