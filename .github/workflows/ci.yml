name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Ubuntu runners ship Docker Compose and PowerShell, so the app tests also
    # run `docker compose config` and parse every .ps1.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm build
